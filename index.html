<!DOCTYPE html>
<html lang="">

  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokopia Housing Solver by Matt Lincoln</title>
    <style>
      /* Static splash shown before the JS bundle loads; colors mirror
         tropical-theme.css (--trop-sand-50 bg, --trop-text, --trop-ocean-500). */
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        background: #fff7ea;
        color: #2a4c5b;
        font-family: 'Nunito', 'Avenir Next', 'Segoe UI', sans-serif;
        gap: 1rem;
        padding: 1rem;
        text-align: center;
      }
      .app-splash-spinner {
        width: 3rem;
        height: 3rem;
        border: 0.35rem solid #c5f2ff;
        border-top-color: #2ba9be;
        border-radius: 50%;
        animation: app-spin 1s linear infinite;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="app-splash" role="status" aria-live="polite">
        <div class="app-splash-spinner" aria-hidden="true"></div>
        <p>Loading Pokopia Housing Solver…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
