name: Deploy Web

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Only production builds that receive the repo secret initialize
          # PostHog (src/main.ts guards on VITE_POSTHOG_TOKEN presence). Local
          # dev / CI preview builds leave it unset and never send analytics, so
          # feature-usage dashboards stay free of dev/e2e noise.
          # ACTION REQUIRED: create the `VITE_POSTHOG_TOKEN` GitHub Actions
          # repository secret before the next deploy — until it exists, the
          # live site's PostHog analytics are disabled.
          VITE_POSTHOG_TOKEN: ${{ secrets.VITE_POSTHOG_TOKEN }}

      - name: Publish site to web branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: web
          folder: dist
          clean: true
          single-commit: true